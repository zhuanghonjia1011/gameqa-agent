[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gameqa-copilot"
version = "0.1.0"
description = "Offline execution starter for a requirements-driven game-testing Agent"
requires-python = ">=3.12"
dependencies = ["pydantic>=2,<3"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "vendor/playtest-agent/src"]
